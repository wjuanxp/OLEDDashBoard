sentence=Professional dashboard UI library for SSD1306 OLED displays (128x64, I2C) on Arduino Uno/Nano/Pro Mini.
paragraph=A widget-based dashboard framework for IoT and sensor projects. Abstract all rendering details: provide data, the library handles layout, rendering, scaling, icons, and historical visualization. Includes theme engine, custom fonts, icons, statistics, and a graph engine with fade/line/bars/filled/dots styles.
category=Display
